# Inter vs Napoli with the fine-tuned 4-class football detector (ball, player, goalkeeper, referee).
# Weights are local only (models/ is not committed); see docs/detector_4class.md.
extends: inter_napoli.yaml

clip:
  id: inter_napoli_fb10  # windows run as inter_napoli_fb10_<window>; the 5 fps runs keep inter_napoli_fb4_<window>

detection:
  model: football_4class/best.pt

teams:
  smoothing:
    enabled: true  # wrong-team rows 6.1% -> 1.4% on the audited windows (tuned on them); split_tracks stays off

offpitch:
  enabled: true

# Working default: 10 fps. On the audited windows 10 fps gave HOTA 0.857 -> 0.871, IDF1 0.860 -> 0.879 and 22 % fewer ID
# switches over 5 fps for about 1.3x the cost (docs/poc_replica.md, "Sampling rate with buffered matching"). Tuned on
# the same three windows, so a pointer, not a proven gain. Frame-count settings are scaled to the same wall-clock
# time as at 5 fps (confirmation 0.4 s, static-ball test 0.6 s). Not yet tested at 10 fps: identity linker, calibration
# drift, replica speeds. The 5 fps experiment chains (inter_napoli_fb4_f5* and descendants) pin 5 fps themselves.
sampling:
  fps: 10.0

tracking:
  minimum_consecutive_frames: 4
  ball:
    static_min_frames: 6
