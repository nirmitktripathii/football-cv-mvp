# Inter vs Napoli: people from the fine-tuned Ultralytics 4-class model, the ball from the YOLOX-m 4-class fine-tune.
# The 4-class model has the better person tracking (HOTA 0.737 against 0.691 for YOLOX, plain tracker) and YOLOX the
# better ball (hit recall 0.380 against 0.212); see docs/finetune_4class.md. Both were judged on the audited windows.
extends: inter_napoli_4class.yaml

clip:
  id: inter_napoli_fb4yb   # windows run as inter_napoli_fb4yb_<window>

detection:
  ball_detector:
    backend: yolox
    model: data/models/yolox_m_football4/best_ckpt.pth
    yolox_repo: data/external/YOLOX
    test_size: [704, 1280]

# Pinned at the 5 fps these results were produced at (docs/poc_replica.md); the working default is now 10 fps.
sampling:
  fps: 5.0

tracking:
  minimum_consecutive_frames: 2
  ball:
    static_min_frames: 3
