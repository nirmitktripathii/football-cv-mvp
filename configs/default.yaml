# Pipeline configuration for the ISL MVP clip. Every stage reads this file;
# override any value on the CLI with --set key.subkey=value.

clip:
  id: isl_bfc_scd_gw1_2026
  video_path: data/raw/isl_bfc_scd_2026-10-10_gw1_section.mp4
  source_url: https://www.youtube.com/watch?v=gDI508P5F3g
  source_title: "FULL REPLAY (English): Bengaluru FC vs Sporting Club Delhi (3-2) | MG ISL 2026-27 | GW 1"
  source_channel: MG Indian Super League
  source_upload_date: "2026-10-10"
  # The section starts at this offset in the full replay (yt-dlp --download-sections "*3120-3480").
  source_offset_s: 3120
  # Replay second at which the on-screen match clock read 00:00, measured from probe frames:
  # the clock read 21:00 at replay second 3125. Used only for match-clock labels.
  kickoff_replay_s: 1865
  home_team: Bengaluru FC
  away_team: Sporting Club Delhi
  home_kit: blue
  away_kit: white
  # Direction of play in this clip window (pitch frame: x = 0 is the image-left goal of the main camera).
  # Measured, not assumed: in calibrated frames near each goal, the deepest outfield player belonged to
  # the away team at the left goal (segments 0, 3, 13: 149 v 33 frames) and to the home team at the right
  # goal (segments 11, 12, 13: 263 v 27). So the home team defends the right goal and attacks left.
  home_attacks: left

paths:
  processed_dir: data/processed
  artifacts_dir: artifacts
  manifests_dir: data/manifests

sampling:
  fps: 5.0              # sampled frames per second of video
  start_s: 0.0
  end_s: null           # null = whole clip
  preview_every_s: 30.0 # write one representative JPEG every N seconds

detection:
  model: yolo11m.pt     # Ultralytics COCO weights (AGPL-3.0); auto-downloaded on first use
  imgsz: 1280           # high input size so the ~8 px ball is not lost by downscaling
  conf_person: 0.25
  conf_ball: 0.10
  device: 0             # CUDA device index, or "cpu"
  half: false  # FP16 on GTX 16xx cards returns NaN boxes (verified on this GTX 1650); keep FP32
  batch: 8
  # Optional second detector used only for the ball (its people are dropped, the main model's ball is dropped).
  # Keys override this block's, e.g. {backend: yolox, model: ..., yolox_repo: ..., test_size: [704, 1280]}.
  ball_detector: null

tracking:
  track_activation_threshold: 0.30
  lost_track_buffer_s: 2.0
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 2
  # Grow every box by box_buffer x its size on each side for matching only (C-BIoU); output boxes are unchanged. At 5 fps a
  # running player often moves more than a box width between samples, so plain IoU loses them. 0 = plain ByteTrack.
  box_buffer: 0.0
  # ByteTrack outputs a track only once it has been matched twice, so a person who appears or reappears loses a frame
  # and one seen once is never output (~18 % of on-pitch detections on the PoC clip). recover gives those back: they
  # join the neighbouring track they overlap (iou), else become a track of their own when confidence >= keep_confidence.
  # Off by default: it raises detection recall 0.81 -> 0.93 and HOTA 0.737 -> 0.755 on the audited windows but costs
  # ID switches (127 -> 361) and IDF1 (0.738 -> 0.709) at keep_confidence 0.8; see docs/poc_replica.md.
  recover:
    enabled: false
    iou: 0.3
    keep_confidence: 0.8
    duplicate_iou: 0.7
  ball:
    # A ball detection that recurs within static_radius_px (stabilised) in at least static_min_frames other samples
    # within static_window_s is a spare ball / penalty spot / line mark and is dropped. min_confidence 0 = no floor.
    static_radius_px: 6.0
    static_window_s: 2.0
    static_min_frames: 3
    min_confidence: 0.0

teams:
  # Torso colour clustering: k=2 kit clusters; referees and goalkeepers are flagged as
  # "other" when their colour is far from both kit centroids.
  min_box_height_px: 18
  other_distance_factor: 2.2
  # Per-row kit from each track's crop colours over time (Viterbi with a switch cost): a track that the
  # tracker swapped between opponents changes team where the shirt changes, one odd crop changes nothing.
  smoothing:
    enabled: false
    llr_scale: 20.0   # Lab distance difference per unit of evidence
    max_llr: 3.0      # cap per crop so one glare crop cannot dominate
    switch_cost: 8.0  # evidence needed to change team
    min_evidence: 1.5 # below this total a track keeps its single label
    split_tracks: false
  # Rows of a home/away track whose crops stay far from both kits for min_run crops in a row are another person on that
  # id (the referee after an identity switch): team other, role referee (goalkeeper when the detector said so).
  # min_gap is in kit-centre separations (1.4 ~ 60 Lab units here). min_run 10 (2 s at 5 fps): referee runs span 17-43 samples,
  # the false ones (a red away player, a yellow keeper) 3-8. Both picked on the 3-minute clip, so in-sample.
  outlier_runs:
    enabled: false
    min_gap: 1.4
    min_run: 10
  # Goalkeeper tracks under min_rel_height x the median player track and at most max_rows long are pitch marks or boards
  # called keepers (0.3-0.7 x, 1-25 rows on the 3-minute clip); the four real keepers are 0.8-1.1 x and 82+ rows.
  goalkeeper_gate:
    enabled: false
    min_rel_height: 0.7
    max_rows: 40

offpitch:
  # After calibration: drop person tracks whose median position is this far outside the lines (staff, substitutes
  # warming up, ball boys; referees and goalkeepers exempt), and balls that are off the pitch and unlinked to play or
  # sitting still on a penalty/centre spot. Off by default; see src/football_cv/calibration/offpitch.py.
  enabled: false
  people_outside_m: 2.0
  people_min_rows: 3
  ball_outside_m: 2.0

role_probe:
  # Stage "roles" (after calibrate, before identity): referee and goalkeeper labels from SRITrack crop embeddings plus a
  # goal-centre keeper prior (docs/role_probe.md stage 2). Off by default. Boxes without a crop or without a usable
  # calibration keep the detector role. Train the model with scripts/train_role_probe.py.
  enabled: false
  model: models/role_probe/all.npz
  checkpoint: models/sritrack/model.pth.tar-60
  feature: fc
  keeper_rule: prior_or_probe   # prior_only: prior alone (Q0); prior_or_probe_in_area: probe-only keepers must be in a penalty area (stage 3)
  min_side_px: 8
  edge_margin_px: 2     # stage 3b: boxes within this many px of the frame edge keep the detector role (cut-off people); null = off
  min_height_px: 20     # stage 3b: boxes shorter than this keep the detector role; null = off
  penalty_depth_m: 16.5
  penalty_half_width_m: 20.16
  tie_m: 2.0

shots:
  # A sampled frame is a usable "wide tactical view" when enough of the image is pitch-green
  # and players look small. Close-ups, replays and crowd shots fail this test.
  min_green_ratio: 0.45
  max_median_person_height_px: 95
  min_persons: 6
  cut_hist_threshold: 0.45

calibration:
  pitch_length_m: 105.0  # reference dimensions, not a survey of the stadium pitch
  pitch_width_m: 68.0
  keyframes_file: configs/calibration_keyframes.json
  orb_features: 3000
  min_inliers: 60
  max_chain_s: 600.0  # chains break on cuts or failed matches; drift is bounded by extra keyframes
  pitch_margin_m: 3.0    # projected points further outside the pitch than this are rejected
  max_keyframe_dt_s: 12.0  # frames further in time from their keyframe are rejected: measured drift reaches
                          # 5-10 m at 11-22 s during the long pan of segment 13 (docs/evaluation.md)

trajectories:
  max_speed_mps: 11.0    # faster implied speeds between observations are flagged as jumps
  min_track_points: 5

reconstruction:
  # Gap filling for person tracks (docs/implementation_plan.md). Positions are never invented across
  # camera cuts or uncalibrated frames; estimates less certain than max_sigma_m are withheld.
  interpolate: rts          # between two observations: rts | linear
  predict: cv               # after the last observation: cv | kalman | hold
  max_gap_s: 8.0
  predict_horizon_s: 2.0
  max_occlusion_s: 3.0
  max_sigma_m: 5.0
  view_margin_px: 20.0
  image_size: [1280, 720]
  annotations_file: null    # manual events (injury treatment, return, confirmed substitution); none for this clip
  eval_gap_lengths_s: [0.6, 1.0, 2.0, 4.0, 8.0]

identity:
  # Conservative tracklet linking (src/football_cv/tracking/identity.py). Off by default: on held-out
  # SkillCorner data its links were right only 86 % of the time and covered ~3 % of true continuations,
  # below the 98 % precision target (docs/evaluation.md section 11). A wrong merge is invisible, so it stays off.
  apply: false              # true: reconstruct() uses the linked identity ids
  use_appearance: true      # kit-colour veto from shirt / shorts / socks bands
  edge_margin_px: 20.0      # a tracklet end whose box touches the image border is an "edge" end
  max_gap_s: 6.0
  max_false_matches: 0.5
  ambiguity_margin: 6.0
  calibration_sigma_m: 3.0   # the value it was evaluated at (docs/evaluation.md section 11)

regions:
  # Inferred probable regions for unobserved players (src/football_cv/reconstruction/regions.py).
  calibration_sigma_m: 5.0
  region_mass: 0.9
  min_teammates: 3
  horizon_s: 8.0
  sigma_growth_per_m: 0.15   # tuned on period 1 of the SkillCorner match (docs/evaluation.md section 11)
  use_shape: true

analytics:
  xt_model_path: models/xt_model.json
  top_sequences: 5
  atomic_vaep:
    # Legacy SPADL stores (StatsBomb open data converted with socceraction) from the sibling
    # VAEP_Football project. Trained on club leagues, evaluated on the held-out World Cup 2018.
    spadl_dir: ../VAEP_Football/spadl
    train_stores: ["spadl-Premier League.h5", "spadl-La Liga.h5"]
    test_store: spadl-WorldCup-2018.h5
    max_games_per_store: null   # null = all games; set e.g. 50 for a quick run
    seed: 0
